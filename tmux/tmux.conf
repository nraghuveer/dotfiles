set -g mouse on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar - Clean Modern Design
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 100
set -g status-right-length 100

# Left side: Session name with icon
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold]  #S  #[bg=#1e1e2e] '

# Right side: Time, Date, Host
set -g status-right '#[fg=#6c7086] %H:%M #[fg=#7f849c]|#[fg=#a6adc8] %d-%b-%Y #[fg=#7f849c]|#[fg=#89b4fa] #h '

# Window tabs - Clean style
set -g window-status-format '#[fg=#6c7086] #I #[fg=#cdd6f4]#W '
set -g window-status-current-format '#[bg=#313244,fg=#89b4fa,bold] #I #[fg=#cdd6f4]#W '
set -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Message styling
set -g message-style 'bg=#313244 fg=#cdd6f4'
set -g message-command-style 'bg=#313244 fg=#cdd6f4'

# Clock mode
set -g clock-mode-colour '#89b4fa'
set -g clock-mode-style 24

# Mode style (copy mode, etc.)
set -g mode-style 'bg=#89b4fa fg=#1e1e2e bold'

# Set prefix key to Ctrl+Space (optional, uncomment if you want)
# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

# Reload config shortcut
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Config reloaded!'
